<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/briobox-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BrioBox</title>
    <style>
      * 
      body { background-color: #09090b; }

   

      .splash-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
      }

      .splash-title {
        color: #ffffff;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-align: center;
      }

      .splash-sub {
        color: #52525b;
        font-size: 0.75rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        text-align: center;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 2px solid #27272a;
        border-top-color: #71717a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-wrapper">
        <div class="splash">
          <div>
            <p class="splash-title">BRIOBOX</p>
            <p class="splash-sub">Centro de Entrenamiento</p>
          </div>
          <div class="spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
